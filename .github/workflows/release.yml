# Publishes a release when a tag like v2.1 is pushed: builds the app, makes the npm installer
# (@mrpwob/mail-app) with that release inside, publishes it to npm, and adds a GitHub release with the
# notes from shared/changelog.json. Publishes with npm trusted publishing (set up on npmjs.com for release.yml), so it needs no npm token.
name: Release

on:
  push:
    tags: ["v*"]
  # Or run it from the Actions tab: it tags the newest version itself.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check the tag matches shared/changelog.json
        id: v
        run: |
          version=$(jq -r '.releases[0].version' shared/changelog.json)
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} doesn't match the newest version in shared/changelog.json (${version})." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          jq -r '.releases[0] | "## \(.title)\n\n" + (.changes | map("- " + .) | join("\n"))' shared/changelog.json > "$RUNNER_TEMP/notes.md"
          echo "title=$(jq -r '.releases[0].title' shared/changelog.json)" >> "$GITHUB_OUTPUT"
      - run: npm run package
      - name: Publish to npm
        working-directory: npm
        # Trusted publishing: npm checks this workflow by its GitHub sign-in, so no token is needed.
        run: npm install -g npm@11 && npm publish --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" --target "$GITHUB_SHA" --title "Mail App ${{ steps.v.outputs.version }}: ${{ steps.v.outputs.title }}" --notes-file "$RUNNER_TEMP/notes.md"
